    <title>Library Module</title>
    <script>
        function is_available(boolean) {
            if (boolean) {
                alert("The book is available");
            } else {
                alert("The book is not available");
            }
        }

        function is_added(boolean) {
            if (boolean) {
                alert("The book has been added to your cart");
            } else {
                alert("The book cannot be added to your cart");
            }
        }

        }
    </script>
</head>
<body>
    <header>
        <h2>Welcome to the Library</h2>
        <p tag="header_text">Choose a book to check its availability or add it to your cart.</p>
    </header>
    <div class="flex-container">
        <div class = "books">
            <h3>DSA Book</h3>
            <img src="/pre_JS/image.png" alt="">
            <br><br>
            <button onclick="is_available(true)">Check Book Availability</button><br><br>
            <button onclick="is_added(true)">Add</button>
        </div>
    
        <div class = "books">
            <h3>JavaScript Book</h3>
            <img src="/pre_JS/image copy.png" alt="">
            <br><br>
            <button onclick="is_available(false)">Check Book Availability</button><br><br>
            <button onclick="is_added(false)">Add</button>
        </div>

        <div class = "books">

            <button onclick="is_available(true)">Check Book Availability</button><br><br>
            <button onclick="is_added(true)">Add</button>
